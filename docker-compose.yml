services:
  mpola-api:
    build: .
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./static:/app/static
    restart: always
    networks:
      - shared_network

networks:
  shared_network:
    external: true
